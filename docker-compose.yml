services:
  fundlens:
    build:
      context: .
    ports:
      - "8501:8501"
    environment:
      FUNDLENS_MAX_FILE_SIZE_MB: "15"
      FUNDLENS_MAX_PDF_PAGES: "30"
      FUNDLENS_MIN_PRICE_OBSERVATIONS: "20"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true

